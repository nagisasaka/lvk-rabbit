name: Validate and release pet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: pet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install image validation dependency
        run: |
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
      - name: Test packaging safeguards
        run: .release-venv/bin/python -m unittest discover -s tests -v
      - name: Validate and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            .release-venv/bin/python scripts/build_release.py --tag "$RELEASE_TAG"
          else
            .release-venv/bin/python scripts/build_release.py
          fi

  publish:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the validated tagged package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
          .release-venv/bin/python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish_release.sh
